[project]
name = "marketeam-backend"
version = "0.1.0"
description = "FastAPI backend for the Marketeam AI career platform"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Stub handlers legitimately ignore their injected dependencies.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/api/v1/routes/*" = ["ARG001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
